name: Build Midscene Omarchy VM image

on:
  workflow_dispatch:
  push:
    branches:
      - test/midscene-fcitx5-quickphrase
    paths:
      - "tests/midscene/.rebuild-omarchy-vm"
      - "tests/midscene/install-omarchy-vm.sh"
      - "tests/midscene/publish-omarchy-vm.sh"
      - "tests/midscene/omarchy-vm.env"

permissions:
  contents: read
  packages: write

concurrency:
  group: omarchy-vm-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Install and publish Omarchy base VM
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4 # v7.0.1
        with:
          persist-credentials: false

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Install Omarchy from the verified official ISO
        run: tests/midscene/install-omarchy-vm.sh

      - name: Sign in to GitHub Container Registry
        run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ github.token }}

      - name: Publish versioned Omarchy base VM
        run: tests/midscene/publish-omarchy-vm.sh

      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@v4 # v7.0.1
        with:
          name: omarchy-vm-image-installer-evidence
          path: .midscene-omarchy/omarchy-iso/test-runs/**/runs/**
          if-no-files-found: warn
          retention-days: 3
