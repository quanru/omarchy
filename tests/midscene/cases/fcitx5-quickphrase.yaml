cases:
  - name: Stock Omarchy opens fcitx5 QuickPhrase on Super+grave (control)
    steps:
      - fcitx.resetDefault: {}
      - shell.openTerminal: {}
      - fcitx.invokeQuickPhrase:
          chord: [meta_l, grave_accent]
      - aiAssert: >-
          A fcitx5 Quick Phrase popup is open: a bordered white menu titled
          "Quick Phrase:" positioned near the top-left of the focused
          terminal, showing a row of numbered candidate entries (for example
          kaomoji strings ending in "ah"). The addon may also show the typed
          letter "a" as preedit text at the terminal cursor position, which
          is expected. The decisive signal is that the Quick Phrase
          candidate menu itself is clearly visible.
      - fcitx.cancel: {}

  - name: Shipped quickphrase.conf frees Super+grave but keeps Super+semicolon (omarchy issue 12365)
    steps:
      - fcitx.applyFix: {}
      - shell.openTerminal: {}
      - fcitx.invokeQuickPhrase:
          chord: [meta_l, grave_accent]
      - aiAssert: >-
          No fcitx5 Quick Phrase popup, candidate menu or composing window
          is visible anywhere on the screen. The Super+grave chord was not
          captured by the input method, and the lowercase letter "a" was
          typed directly into the focused terminal at the shell prompt
          rather than opening any fcitx5 UI.
      - fcitx.cancel: {}
      - fcitx.invokeQuickPhrase:
          chord: [meta_l, semicolon]
      - aiAssert: >-
          A fcitx5 Quick Phrase candidate menu titled "Quick Phrase:" is now
          open in the focused terminal with numbered candidate entries,
          proving that only the colliding Super+grave trigger was removed
          while the unrelated Super+semicolon default trigger still works.
      - fcitx.resetDefault: {}
      - fcitx.cancel: {}
